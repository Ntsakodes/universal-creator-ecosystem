name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uce
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: uce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://uce:local-development-only@localhost:5432/uce_test?schema=public
      AUTH_CLIENT_ID: integration-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env
      # A lockfile must be generated, reviewed and committed on first online install.
      - run: npm install
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:integration
      - run: npm run build
