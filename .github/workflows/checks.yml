name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uce
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: uce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://uce:local-development-only@localhost:5432/uce_test?schema=public
      AUTH_CLIENT_ID: integration-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm test
      - name: Check API decorator loading from repository root
        run: node --import tsx --input-type=module -e "await import('./apps/api/src/supabase-test/app.ts')"
      - run: npm run typecheck
      - run: npm run test:integration
      - name: Prepare isolated Supabase adapter fixture database
        env:
          PGPASSWORD: local-development-only
        run: |
          psql -h localhost -U uce -d postgres -c 'CREATE DATABASE uce_supabase_test;'
          psql -h localhost -U uce -d postgres -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          DATABASE_URL=postgresql://uce:local-development-only@localhost:5432/uce_supabase_test?schema=uce_test npm run db:deploy
      - name: Prepare pre-existing hosted-schema fixture
        env:
          PGPASSWORD: local-development-only
        run: |
          psql -h localhost -U uce -d postgres -c 'CREATE DATABASE uce_supabase_baseline;'
          psql -h localhost -U uce -d uce_supabase_baseline -c 'CREATE SCHEMA uce_test;'
          PGOPTIONS='--search_path=uce_test' psql -v ON_ERROR_STOP=1 -h localhost -U uce -d uce_supabase_baseline -f prisma/migrations/202611050001_foundation/migration.sql
          PGOPTIONS='--search_path=uce_test' psql -v ON_ERROR_STOP=1 -h localhost -U uce -d uce_supabase_baseline -f prisma/migrations/202611050002_integrity/migration.sql
      - run: npm run test:supabase-integration
      - run: npm run build
